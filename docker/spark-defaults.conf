# ============================================================
# Spark defaults untuk SiPeka (di-COPY ke $SPARK_HOME/conf/)
# ------------------------------------------------------------
# Kenapa memakai file, bukan echo di Dockerfile:
#   - Shell heredoc di RUN tidak andal lintas builder
#   - File bisa di-diff dan direview seperti kode biasa
#   - Semua notebook & script otomatis memakai setting ini
# ============================================================

# --- Mode eksekusi: satu JVM di dalam container (driver = executor) ---
spark.master                        local[*]

# --- Memori: DIBATASI karena RAM host hanya 7,7 GB ---
# Total limit container jupyter 2,6 GB; driver 1g menyisakan ruang
# untuk OS, PySpark, dan Jupyter sendiri.
spark.driver.memory                 1g
spark.driver.maxResultSize          512m

# --- Shuffle: kecilkan dari default 200 supaya hemat RAM pada data 1,1 juta baris ---
spark.sql.shuffle.partitions        8
spark.sql.adaptive.enabled          true
spark.sql.adaptive.coalescePartitions.enabled true

# --- Timezone & parsing tanggal: data DKI Jakarta ---
spark.sql.session.timeZone          Asia/Jakarta
spark.sql.legacy.timeParserPolicy   CORRECTED

# --- JDBC driver PostgreSQL ---
spark.jars                          file:///opt/jdbc/postgresql-42.7.4.jar
spark.driver.extraClassPath         /opt/jdbc/postgresql-42.7.4.jar

# --- HDFS data lake ---
spark.hadoop.fs.defaultFS                       hdfs://namenode:9000
spark.hadoop.dfs.replication                    1
spark.hadoop.dfs.client.use.datanode.hostname   false

# --- Spark UI (port 4040 dipetakan di docker-compose kalau perlu) ---
spark.ui.enabled                    true
spark.ui.port                       4040
